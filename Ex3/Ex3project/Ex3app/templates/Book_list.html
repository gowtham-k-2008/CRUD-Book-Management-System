
<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
</head>
<body>
    <h1>Book Management System</h1>

    <a href="{% url 'Book_create' %}">
        Add Book
    </a>

    <hr>

    <table border="1" cellpadding="10">
        <tr>
            <th>title</th>
            <th>author</th>
            <th>price</th>
            
        </tr>

        {% for Book in Books %}
        <tr>
            <td>{{ Book.title }}</td>
            <td>{{ Book.author }}</td>
            <td>{{ Book.price }}</td>
            <td>
                <a href="{% url 'Book_update' Book.id %}">
                    Edit
                </a>

                <form method="POST"
                      action="{% url 'Book_delete' Book.id %}"
                      style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No Books found</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
